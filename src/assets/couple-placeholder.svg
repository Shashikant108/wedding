<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf1ec"/>
      <stop offset="100%" stop-color="#f6dfe0"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f1d33"/>
      <stop offset="100%" stop-color="#6f1526"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c27a"/>
      <stop offset="100%" stop-color="#c9973f"/>
    </linearGradient>
  </defs>

  <rect width="900" height="700" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="90" r="120" fill="#f2c9c9" opacity="0.35"/>
  <circle cx="820" cy="620" r="150" fill="#e7b8bf" opacity="0.3"/>

  <!-- mandala rings -->
  <circle cx="450" cy="330" r="230" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
  <circle cx="450" cy="330" r="205" fill="none" stroke="#c9973f" stroke-width="1.5" opacity="0.45"/>

  <!-- archway silhouette -->
  <path d="M330 470 V330 a120 120 0 0 1 240 0 V470 Z" fill="url(#arch)" opacity="0.95"/>
  <path d="M330 470 V330 a120 120 0 0 1 240 0 V470 Z" fill="none" stroke="#e8c27a" stroke-width="4"/>

  <!-- monogram -->
  <text x="450" y="345" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#f7e6c4" font-weight="600">R&amp;S</text>
  <text x="450" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f2d9a8" letter-spacing="6">RAMLAKHAN &amp; SANGEETA</text>

  <!-- floral corner top-left -->
  <g transform="translate(60,60)" opacity="0.85">
    <path d="M0 60 C10 20 40 0 70 10 C50 20 40 45 60 60 C30 65 10 80 0 60 Z" fill="#c65d6b"/>
    <path d="M20 40 C25 20 45 10 60 20 C48 25 45 40 55 48 C38 52 25 55 20 40 Z" fill="#e39aa4"/>
    <circle cx="30" cy="30" r="6" fill="#7a3540"/>
  </g>

  <!-- floral corner bottom-right -->
  <g transform="translate(780,560) rotate(180)" opacity="0.85">
    <path d="M0 60 C10 20 40 0 70 10 C50 20 40 45 60 60 C30 65 10 80 0 60 Z" fill="#c65d6b"/>
    <path d="M20 40 C25 20 45 10 60 20 C48 25 45 40 55 48 C38 52 25 55 20 40 Z" fill="#e39aa4"/>
    <circle cx="30" cy="30" r="6" fill="#7a3540"/>
  </g>

  <!-- small hearts scattered -->
  <path d="M140 560 c-10-10 -26-4 -26 10 c0 14 26 26 26 26 s26-12 26-26 c0-14 -16-20 -26-10z" fill="#e39aa4" opacity="0.8"/>
  <path d="M760 140 c-8-8 -20-3 -20 8 c0 11 20 20 20 20 s20-9 20-20 c0-11 -12-16 -20-8z" fill="#c65d6b" opacity="0.7"/>

</svg>
